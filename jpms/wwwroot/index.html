<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JPMS · Jewel Project Management System</title>
    <base href="/" />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#101111" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JPMS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link href="css/app.built.css" rel="stylesheet" />
</head>

<body>
    <!--
        Blazor's root. Empty on purpose: the boot screen is NOT in here. It used to be, which
        meant Blazor wiped it the moment it rendered its first frame — before the session had even
        been checked — so the user saw a big centred jewel, then the chrome snapping in around a
        second smaller jewel somewhere else, then the page. Three states for one wait.
    -->
    <div id="app"></div>

    <!--
        The boot screen: a sibling overlay, held up until the app has something real to show and
        then faded out by the app itself (js/boot-screen.js, called from ApprovedSessionGate and
        LandingLayout). It mirrors the in-app jewel exactly — same ring, same pulse — so the
        handover is a crossfade onto a drawn screen rather than a flicker between two designs.
    -->
    <div id="boot" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5 bg-canvas">
        <div class="relative w-16 h-16 grid place-items-center">
            <div class="absolute inset-0 rounded-full border-2 border-surface-field border-t-content/70 animate-spin"></div>
            <svg class="w-6 h-6 animate-jewel-pulse" viewBox="0 0 530 460" fill="none" stroke="currentColor"
                 stroke-width="34" stroke-linejoin="miter" stroke-linecap="butt"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M 140 30 L 390 30 L 510 175 L 265 430 L 20 175 Z" />
                <path d="M 55 175 L 475 175" />
                <path d="M 185 30 L 185 175" />
                <path d="M 345 30 L 345 175" />
                <path d="M 185 175 L 265 430" />
                <path d="M 345 175 L 265 430" />
            </svg>
        </div>
        <p class="text-sm text-content-subtle">Loading JPMS</p>
    </div>

    <!--
        Last resort only. Anything the app can catch is reported in the full-width toast at the top
        of the screen (ErrorToast.razor), with a copyable reference. This strip appears when the
        renderer itself has stopped, and the only remaining option is a reload.
    -->
    <div id="blazor-error-ui">
        JPMS has stopped responding and needs to be reloaded. Anything already saved is safe.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/boot-screen.js"></script>
    <script src="js/search-select.js"></script>
    <script src="js/recipient-input.js"></script>
    <script src="js/sticky-scroll.js"></script>
    <script src="js/pdf-viewer.js"></script>
    <script src="js/excel-export.js"></script>
    <script src="js/focus-element.js"></script>
    <script src="js/modal-autofocus.js"></script>
    <script src="js/app-update.js"></script>
    <script src="js/rich-compose-caret.js"></script>
    <script src="js/rich-compose-autocapitalise.js"></script>
    <script src="js/rich-compose.js"></script>
    <script src="js/todo-board.js"></script>
    <script src="js/panel-workspace.js"></script>
    <script src="js/chat-drop.js"></script>
    <script src="js/chat-composer-keys.js"></script>
    <script src="js/chat-scroll.js"></script>
    <script src="js/lead-qr.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Manual boot, for resilience Blazor doesn't provide on its own. Safari in particular can
        // drop the download of dotnet.native.wasm (the one multi-megabyte boot file) with a bare
        // "TypeError: Load failed", and the stock loader just gives up — leaving the jewel pulsing
        // forever over a blank page. Two defences:
        //
        //   1. loadBootResource retries each failed download, backing off briefly and switching to
        //      cache: 'reload' plus a cache-busting query so the retry cannot be served whatever
        //      truncated or stale response broke the first attempt.
        //   2. If boot still fails, the loading screen is swapped for a plain "couldn't load /
        //      try again" prompt — a reload also picks up a fresh index.html and boot manifest,
        //      which is the cure when a deploy landed mid-download and the file no longer matched
        //      its integrity hash.
        (function () {
            const fetchWithRetry = (defaultUri, integrity) => {
                const attempt = (n) =>
                    fetch(n === 0 ? defaultUri : defaultUri + '?retry=' + n, {
                        cache: n === 0 ? 'no-cache' : 'reload',
                        integrity: integrity || undefined
                    }).then((response) => {
                        if (!response.ok) throw new Error(response.status + ' ' + defaultUri);
                        return response;
                    }).catch((error) => {
                        if (n >= 2) throw error;
                        return new Promise((resolve) => setTimeout(resolve, 500 * (n + 1)))
                            .then(() => attempt(n + 1));
                    });
                return attempt(0);
            };

            Blazor.start({
                loadBootResource: (type, name, defaultUri, integrity) =>
                    type === 'dotnetjs' ? defaultUri : fetchWithRetry(defaultUri, integrity)
            }).catch((error) => {
                console.error('JPMS failed to boot', error);
                window.jpmsBoot.fail(
                    '<div class="min-h-dvh flex flex-col items-center justify-center gap-5 bg-canvas px-6 text-center">' +
                        '<svg class="w-8 h-8 text-content-subtle" viewBox="0 0 530 460" fill="none" stroke="currentColor" stroke-width="34" stroke-linejoin="miter" stroke-linecap="butt" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
                            '<path d="M 140 30 L 390 30 L 510 175 L 265 430 L 20 175 Z" /><path d="M 55 175 L 475 175" /><path d="M 185 30 L 185 175" /><path d="M 345 30 L 345 175" /><path d="M 185 175 L 265 430" /><path d="M 345 175 L 265 430" />' +
                        '</svg>' +
                        '<div class="flex flex-col gap-1.5">' +
                            '<p class="text-sm text-content">JPMS couldn\'t finish loading.</p>' +
                            '<p class="text-xs text-content-subtle">Usually a connection blip — trying again normally sorts it.</p>' +
                        '</div>' +
                        '<button type="button" onclick="location.reload()" class="rounded bg-accent hover:bg-accent-hover text-accent-ink px-4 py-2 text-sm font-medium transition">Try again</button>' +
                    '</div>');
            });
        })();
    </script>
</body>

</html>
